name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build imagen Docker
        run: docker build -t riesgo-crediticio-api .

      - name: Levantar contenedor
        run: docker run -d --name riesgo-api -p 8000:8000 riesgo-crediticio-api

      - name: Esperar y verificar /health
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              echo ""
              echo "API respondio correctamente en el intento $i"
              exit 0
            fi
            echo "Esperando a que la API arranque... (intento $i)"
            sleep 2
          done
          echo "La API no respondio a tiempo"
          exit 1

      - name: Logs del contenedor (siempre, para debug)
        if: always()
        run: docker logs riesgo-api || true

      - name: Detener contenedor
        if: always()
        run: docker rm -f riesgo-api || true
