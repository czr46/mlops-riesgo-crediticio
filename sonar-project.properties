sonar.projectKey=czr46_mlops-riesgo-crediticio
sonar.organization=czr46

# Nombre y version mostrados en la interfaz de SonarCloud.
sonar.projectName=mlops-riesgo-crediticio
sonar.projectVersion=1.0

# Solo se analiza el codigo fuente (src/); se excluyen los notebooks
# (SonarCloud no analiza .ipynb) y las carpetas generadas por el pipeline
# (datos, modelos, reportes), que no son codigo fuente.
sonar.sources=src
sonar.exclusions=src/*.ipynb,**/__pycache__/**

sonar.python.version=3.11
sonar.sourceEncoding=UTF-8
